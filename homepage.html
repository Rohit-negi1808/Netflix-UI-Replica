<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix India - Watch TV Shows Online, Watch Movies Online</title>
    <link
      rel="icon"
      href="http://pngimg.com/uploads/netflix/small/netflix_PNG15.png"
    />
  <link rel="stylesheet" href="src/homepage.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar__brand">
      <img
        src="https://www.freepnglogos.com/uploads/netflix-logo-0.png"
        alt="logo"
        class="brand__logo"
      />
    </div>
    <nav>
      <ul>
        <li>Home</li>
        <li>TV Shows</li>
        <li>Movies</li>
        <li>New & Popular</li>
        <li>My List</li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content" id="hero">
      <h1 id="hero-title">Interstellar</h1>
      <p id="hero-description">When Earth becomes uninhabitable in the future, a farmer and ex-NASA pilot, Joseph Cooper, is tasked to pilot a spacecraft, along with a team of researchers, to find a new planet for humans.</p>
      <div class="buttons">
        <a href="#" id="play-link"><button class="btn play">▶ Play</button></a>
        <a href="#" id="more-info-link"><button class="btn info">ℹ More Info</button></a>

      </div>
    </div>
  </section>
  

  <section class="row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img src="img\jurassic world1.jpeg" alt="Movie 1" data-id="jurassicworld" />
      <img src="img\stranger things.jpg" alt="Movie 2" data-id="strangerthings"/>
      <img src="img\john wick.jpg" alt="Movie 3" data-id="johnwick"/>
      <img src="img\topgun.jpg" alt="Movie 3" data-id="topgun"/>
      <img src="img\kota factory1.webp" alt="Movie 4" data-id="kotafactory"/>
      <img src="img\money heist.avif" alt="Movie 5" data-id="moneyheist"/>
    </div>
  </section>
  <section class="row">
    <h2>Popular</h2>
    <div class="row-posters">
      <img src="img/interstellar2.jpg" alt="Movie" data-id="interstellar" />
      <img src="img/john wick.jpg" alt="Movie" data-id="johnwick" />
      <img src="img/money heist.avif" alt="Movie" data-id="moneyheist" />
    </div>
  </section>
    <section class="row">
        <h2>Series</h2>
        <div class="row-posters">
        <img src="img\kota factory1.webp" alt="Movie 4" data-id="kotafactory"/>
        <img src="img/money heist.avif" alt="Movie 5" data-id="moneyheist" />
        <img src="img\stranger things.jpg" alt="Movie 2" data-id="strangerthings"/>
        </div>

        <script>
          const movieData = {
            interstellar: {
              title: "Interstellar",
              description:
                "When Earth becomes uninhabitable in the future, a farmer and ex-NASA pilot, Joseph Cooper, is tasked to pilot a spacecraft, along with a team of researchers, to find a new planet for humans.",
              background:
                "url('img/interstellar.jpg')",
              infoLink: "https://www.imdb.com/title/tt0816692/"
            },
            johnwick: {
              title: "John Wick",
              description:
                "Legendary hitman John Wick comes out of retirement to seek vengeance against those who wronged him, unleashing an unstoppable wave of fury and action.",
              background:
                "url('img/john wick.jpg')",
              infoLink: "https://www.imdb.com/title/tt2911666/"
            },
            moneyheist: {
              title: "Money Heist",
              description:
                "A criminal mastermind known as 'The Professor' recruits eight people with unique skills to carry out the biggest heist in recorded history – to print billions of euros in the Royal Mint of Spain.",
              background:
                "url('img/money heist.avif')",
              infoLink: "https://www.imdb.com/title/tt6468322//"
            },
            strangerthings: {
              title: "Stranger Things",
              description:
                "When a young boy vanishes, a small town uncovers a mystery involving secret experiments, terrifying supernatural forces, and one strange little girl.",
              background:
                "url('img/stranger things.jpg')",
              infoLink: "https://www.imdb.com/title/tt4574334/"
            },
            kotafactory: {
              title: "Kota Factory",
              description:
                "In the city of Kota, known for its coaching centers, a teenager named Vaibhav navigates the pressures of competitive exams, friendships, and growing up.",
              background:
                "url('img/kota factory1.webp')",
              infoLink: "https://www.imdb.com/title/tt9432978//"
            },
            topgun: {
              title: "Top Gun",
              description:
                "After more than thirty years of service, Maverick is still pushing the envelope as a top naval aviator but must confront the ghosts of his past when he leads Top Gun's elite graduates on a dangerous mission.",
              background:
                "url('img/topgun.jpg')",
              infoLink: "https://www.imdb.com/title/tt0092099/"
            },
            jurassicworld: {
              title: "Jurassic World",
              description:
                "A new theme park, built on the original site of Jurassic Park, creates a genetically modified hybrid dinosaur that escapes containment and sparks chaos on the island.",
              background:
                "url('img/jurassic world1.jpeg')",
              infoLink: "https://www.imdb.com/title/tt0369610/"
            }
          };
        
          const posters = document.querySelectorAll(".row-posters img");
          const heroTitle = document.getElementById("hero-title");
          const heroDesc = document.getElementById("hero-description");
          const heroSection = document.querySelector(".hero");
        
          posters.forEach((poster) => {
            poster.addEventListener("click", () => {
              const id = poster.dataset.id;
              const data = movieData[id];
              if (data) {
                heroTitle.textContent = data.title;
                heroDesc.textContent = data.description;
                heroSection.style.backgroundImage = `${data.background}`;
              }
            });
          });
        
          const playLink = document.getElementById("play-link");
          const moreInfoLink = document.getElementById("more-info-link");
          let currentMovieId = "interstellar"; // default movie
        
          posters.forEach((poster) => {
            poster.addEventListener("click", () => {
              const id = poster.dataset.id;
              const data = movieData[id];
              if (data) {
                currentMovieId = id; // store the current ID
                heroTitle.textContent = data.title;
                heroDesc.textContent = data.description;
                heroSection.style.backgroundImage = data.background;
              }
            });
          });
        
          playLink.addEventListener("click", (e) => {
            e.preventDefault();
            window.location.href = `watch.html?movie=${currentMovieId}`;
          });
        
          moreInfoLink.addEventListener("click", (e) => {
            e.preventDefault();
            const data = movieData[currentMovieId];
            if (data && data.infoLink) {
              window.location.href = data.infoLink;
            }
          });
          
        </script>
        
        
</body>
</html>
