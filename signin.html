<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Netflix Sign In</title>
  <link rel="icon" href="http://pngimg.com/uploads/netflix/small/netflix_PNG15.png"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Roboto', sans-serif;
    }

    .background {
      background: url('https://assets.nflxext.com/ffe/siteui/vlv3/9c5457b8-9ab0-4a04-9fc1-e608d5670f1a/710d74e0-7158-408e-8d9b-23c219dee5df/IN-en-20210719-popsignuptwoweeks-perspective_alpha_website_small.jpg') no-repeat center center/cover;
      height: 100vh;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(3px);
    }

    .signin-box {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 380px;
      padding: 40px;
      background-color: rgba(0, 0, 0, 0.75);
      transform: translate(-50%, -50%);
      border-radius: 8px;
      color: #fff;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
      animation: fadeIn 1s ease-out;
    }

    .signin-box h1 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
      color: #dc030f;
    }

    .signin-box input[type="email"],
    .signin-box input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background-color: #333;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 14px;
    }

    .signin-box button {
      width: 100%;
      padding: 14px;
      background-color:#dc030f;
      border: none;
      font-size: 16px;
      color: white;
      font-weight: bold;
      border-radius: 4px;
      margin-top: 20px;
      transition: background 0.3s ease;
      cursor: pointer;
    }

    .signin-box button:hover {
      background-color: #f40612;
    }

    .extra-options {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-top: 10px;
      color: #b3b3b3;
    }

    .extra-options a {
      color: #b3b3b3;
      text-decoration: none;
    }

    .extra-options a:hover {
      text-decoration: underline;
    }

    .signup-redirect {
      margin-top: 30px;
      font-size: 14px;
      text-align: center;
    }

    .signup-redirect a {
      color: #fff;
      text-decoration: underline;
    }

    .disclaimer {
      font-size: 12px;
      color: #8c8c8c;
      margin-top: 20px;
      line-height: 1.5;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -60%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="overlay"></div>
    <div class="signin-box">
      <h1>Sign In</h1>
      <form>
        <input type="email" placeholder="Email or phone number" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Sign In</button>

        <div class="extra-options">
          <label><input type="checkbox" /> Remember me</label>
          <a href="#">Need help?</a>
        </div>
      </form>

      <div class="signup-redirect">
        <p>New to Netflix? <a href="signup.html">Sign up now</a>.</p>
      </div>

      <p class="disclaimer">
        This page is protected by Google reCAPTCHA to ensure you're not a bot.
      </p>
    </div>
  </div>
  <script>
    document.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();
    
      const email = document.querySelector('input[type="email"]').value.trim();
      const password = document.querySelector('input[type="password"]').value;
    
      const storedUser = JSON.parse(localStorage.getItem("netflixUser"));
    
      console.log("Stored User:", storedUser);
      console.log("Entered Email:", email);
      console.log("Entered Password:", password);
    
      if (!storedUser) {
        alert("No account found. Please sign up first.");
        return;
      }
    
      if (email === storedUser.email && password === storedUser.password) {
        alert("Welcome back, " + storedUser.name + "!");
        window.location.href = "index.html"; // Redirect to homepage
      } else {
        alert("Incorrect email or password.");
      }
    });
    
  </script>
  
</body>
</html>
